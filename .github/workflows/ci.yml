name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend build
        working-directory: backend
        run: dotnet build

      - name: Backend test
        working-directory: backend
        run: dotnet test --no-build

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: API types are up to date
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code -- ../backend/openapi src/lib/api-types.ts \
            || (echo "::error::OpenAPI or api-types.ts is stale. Run 'dotnet build' in backend/ and 'npm run gen:api' in frontend/, then commit." && exit 1)

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  migrate-db:
    # Runs after a merge to main. Render's "After CI Checks Pass" waits for this job,
    # so the schema is updated before the new API goes live.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: AsikaGo
    concurrency: migrate-db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply EF migrations
        working-directory: backend
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          dotnet tool restore
          dotnet ef database update --project src/AsikaGo.Api --connection "$DB_CONNECTION"
