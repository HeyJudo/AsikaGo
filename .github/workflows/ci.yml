name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend build
        working-directory: backend
        run: dotnet build

      - name: Backend test
        working-directory: backend
        run: dotnet test --no-build

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: API types are up to date
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code -- ../backend/openapi src/lib/api-types.ts \
            || (echo "::error::OpenAPI or api-types.ts is stale. Run 'dotnet build' in backend/ and 'npm run gen:api' in frontend/, then commit." && exit 1)

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build
